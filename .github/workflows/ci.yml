name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests & Card Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/voiceforge \
            --cov-report=term-missing \
            -v

      - name: Validate character cards
        run: python scripts/validate_characters.py
