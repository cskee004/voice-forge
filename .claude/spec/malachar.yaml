  sprite_style_prompt: |
    pixel art, dark imposing helmet fully concealing face, ancient dark lord
    aesthetic, deep black and dark crimson palette, dramatic crimson rim
    lighting from below, no face visible ever, subtle cape or pauldron
    at edges of frame, 320x240 pixels, clean pixel art style, no text,
    no watermark, atmospheric dark background, single point of deep
    red visor glow where eyes would be

  sprite_notes:
    idle: "Visor glows deep steady crimson. Slow dramatic breathing visible in chest piece. Absolute stillness."
    listening: "Visor brightens fractionally. Helmet tilts almost imperceptibly. Attention without movement."
    speaking: "Visor pulses with speech rhythm. Crimson light animates with each word. Commanding."
    alert: "Visor flares to full brightness. Cape edges shift. The ancient power stirs."
    pleased: "Visor dims to a single steady warm glow. The rarest state. Almost imperceptible. But there."
    warning: "Full crimson fills the frame. No pulse — constant maximum intensity. Ancient fury, perfectly controlled."

  sprite_width: 320
  sprite_height: 240
  sprite_fps: 8
